<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Grafana Orange/Yellow Gradient -->
    <linearGradient id="grad-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F47A20" />
      <stop offset="100%" stop-color="#F9AB00" />
    </linearGradient>
    
    <!-- Harvester Teal/Blue Gradient -->
    <linearGradient id="grad-teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00B39F" />
      <stop offset="100%" stop-color="#0075A8" />
    </linearGradient>
    
    <!-- Shadow for depth -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Plugin Dark Background -->
  <rect width="200" height="200" rx="44" fill="#141619" />
  
  <!-- Subtle Grid Background to represent data/dashboard -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.05">
    <line x1="20" y1="50" x2="180" y2="50" />
    <line x1="20" y1="100" x2="180" y2="100" />
    <line x1="20" y1="150" x2="180" y2="150" />
    <line x1="50" y1="20" x2="50" y2="180" />
    <line x1="100" y1="20" x2="100" y2="180" />
    <line x1="150" y1="20" x2="150" y2="180" />
  </g>

  <!-- Harvester Server Nodes (representing the support bundle data) -->
  <g filter="url(#drop-shadow)">
    <!-- Top Node -->
    <rect x="30" y="40" width="110" height="32" rx="8" fill="url(#grad-teal)" />
    <circle cx="50" cy="56" r="4" fill="#ffffff" opacity="0.9" />
    <rect x="66" y="54" width="55" height="4" rx="2" fill="#ffffff" opacity="0.5" />
    <rect x="66" y="46" width="20" height="4" rx="2" fill="#ffffff" opacity="0.3" />

    <!-- Middle Node -->
    <rect x="30" y="82" width="110" height="32" rx="8" fill="url(#grad-teal)" />
    <circle cx="50" cy="98" r="4" fill="#ffffff" opacity="0.9" />
    <rect x="66" y="96" width="35" height="4" rx="2" fill="#ffffff" opacity="0.5" />
    <rect x="105" y="96" width="16" height="4" rx="2" fill="#ffffff" opacity="0.5" />
    <rect x="66" y="88" width="40" height="4" rx="2" fill="#ffffff" opacity="0.3" />

    <!-- Bottom Node -->
    <rect x="30" y="124" width="110" height="32" rx="8" fill="url(#grad-teal)" />
    <circle cx="50" cy="140" r="4" fill="#ffffff" opacity="0.9" />
    <rect x="66" y="138" width="45" height="4" rx="2" fill="#ffffff" opacity="0.5" />
    <rect x="66" y="130" width="25" height="4" rx="2" fill="#ffffff" opacity="0.3" />
  </g>

  <!-- Analyzer Magnifying Glass Overlay -->
  <g filter="url(#drop-shadow)">
    <!-- Handle -->
    <line x1="162" y1="162" x2="184" y2="184" stroke="url(#grad-orange)" stroke-width="16" stroke-linecap="round" />
    
    <!-- Lens Base -->
    <circle cx="135" cy="135" r="44" fill="#1e2028" stroke="url(#grad-orange)" stroke-width="10" />
    
    <!-- Grafana Dashboard Charts inside the lens -->
    <rect x="108" y="125" width="12" height="30" rx="3" fill="url(#grad-orange)" />
    <rect x="128" y="105" width="12" height="50" rx="3" fill="url(#grad-orange)" />
    <rect x="148" y="135" width="12" height="20" rx="3" fill="url(#grad-orange)" />

    <!-- Glass Reflection -->
    <path d="M 108 112 A 28 28 0 0 1 154 112" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.25" />
  </g>
</svg>
