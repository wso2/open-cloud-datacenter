name: support-bundle-analyzer-release

on:
  push:
    tags:
      - 'support-bundle-analyzer/v*'

permissions: {}

concurrency:
  group: support-bundle-analyzer-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release inputs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          
          [[ "$RELEASE_TAG" =~ ^support-bundle-analyzer/v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::Release tag must be support-bundle-analyzer/vX.Y.Z"; exit 1; }

          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/tools \
            || { echo "::error::Release tag commit must be contained in the tools branch"; exit 1; }

          for file in \
            support_bundle_analyzer/grafana-plugin/package-lock.json \
            support_bundle_analyzer/grafana-plugin/go.mod \
            support_bundle_analyzer/grafana-plugin/go.sum; do
            [[ -f "$file" ]] || { echo "::error::Required release input is missing: $file"; exit 1; }
          done

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: support_bundle_analyzer/grafana-plugin/go.mod
          cache-dependency-path: support_bundle_analyzer/grafana-plugin/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: support_bundle_analyzer/grafana-plugin/package-lock.json

      - name: Install frontend dependencies
        working-directory: support_bundle_analyzer/grafana-plugin
        run: npm ci

      - name: Check frontend
        working-directory: support_bundle_analyzer/grafana-plugin
        run: |
          npm run typecheck
          npm run lint
          npm run test:ci

      - name: Test backend
        working-directory: support_bundle_analyzer/grafana-plugin
        run: go test ./...

      - name: Build plugin
        working-directory: support_bundle_analyzer/grafana-plugin
        run: |
          npm run build
          go install github.com/magefile/mage@v1.17.2
          mage -v

      - name: Package plugin
        run: tar -czf "$RUNNER_TEMP/harv-logs-app.tar.gz" -C support_bundle_analyzer/grafana-plugin dist

      - name: Publish tagged release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ runner.temp }}/harv-logs-app.tar.gz
          PR_AUTHOR: ${{ github.actor }}
          RELEASE_DESCRIPTION: >-
              Harv Logs is a local analysis stack for Harvester support bundles, combining Loki log search with Grafana incident timelines and root-cause analysis.
              
              For more details and usage instructions, please refer to the [README](https://github.com/wso2/open-cloud-datacenter/blob/tools/support_bundle_analyzer/README.md).
        run: |
          version="${RELEASE_TAG##*/}"
          
          generated_notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body)
          
          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            printf '%s\n\n' "$RELEASE_DESCRIPTION"
            printf '**Contributor:** @%s\n\n' "$PR_AUTHOR"
            printf '%s\n' "$generated_notes"
          } > "$notes_file"
          
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Support Bundle Analyzer $version" \
              --notes-file "$notes_file"
            gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE" \
              --title "Support Bundle Analyzer $version" \
              --notes-file "$notes_file" \
              --target "$GITHUB_SHA" \
              --latest=false
          fi
