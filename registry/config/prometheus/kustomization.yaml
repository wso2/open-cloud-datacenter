resources:
- monitor.yaml

# The ServiceMonitor verifies the metrics certificate, so enabling it also
# requires the [METRICS WITH CERTMANAGER] resource and patch in
# config/default/kustomization.yaml, which issue "metrics-server-cert" and
# mount it into the manager. Without them the endpoint self-signs for
# localhost and the scrape fails verification.
#
# The CA Secret is read from the namespace Prometheus runs in, so it must be
# replicated there if Prometheus is deployed elsewhere.
