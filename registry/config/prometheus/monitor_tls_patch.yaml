# Verifies the metrics certificate. Requires a cert-manager Certificate writing
# 'metrics-server-cert' with a SAN for the metrics Service DNS name, mounted into
# the manager via the metrics server's CertDir. Only 'ca' is needed — scrapers
# authenticate by bearer token, not client certificate.
- op: replace
  path: /spec/endpoints/0/tlsConfig
  value:
    # SERVICE_NAME and SERVICE_NAMESPACE will be substituted by kustomize
    serverName: SERVICE_NAME.SERVICE_NAMESPACE.svc
    insecureSkipVerify: false
    ca:
      secret:
        name: metrics-server-cert
        key: ca.crt
