apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: registry
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-monitor
  namespace: system
spec:
  endpoints:
  - path: /metrics
    port: https
    scheme: https
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    tlsConfig:
      # The serving certificate is self-signed for localhost, so it cannot be
      # verified against the Service DNS name. Scrapes are authenticated by the
      # bearer token above. Apply monitor_tls_patch.yaml to verify instead.
      insecureSkipVerify: true
  selector:
    matchLabels:
      control-plane: controller-manager
