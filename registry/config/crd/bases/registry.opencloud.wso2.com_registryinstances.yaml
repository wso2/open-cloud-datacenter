  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: registryinstances.registry.opencloud.wso2.com
spec:
  group: registry.opencloud.wso2.com
  names:
    kind: RegistryInstance
    listKind: RegistryInstanceList
    plural: registryinstances
    singular: registryinstance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenantID
      name: Tenant
      type: string
    - jsonPath: .spec.projectID
      name: Project
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.registryURL
      name: URL
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              backendRef:
                description: |-
                  BackendRef references the per-tenant RegistryBackend CR (name: rb-<tenantID>,
                  namespace: dc-tenant-<tenantID>). dc-api sets this; the controller reads it
                  to locate the running Harbor instance across namespaces.
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                - namespace
                type: object
              plan:
                default: starter
                description: Plan selects the Harbor resource profile.
                enum:
                - starter
                - professional
                - enterprise
                type: string
              projectID:
                description: ProjectID is the datacenter project requesting a Harbor
                  project inside the shared Harbor.
                type: string
              reclaimPolicy:
                default: Retain
                description: |-
                  ReclaimPolicy controls what happens to the Harbor project (and its
                  images) when this instance is deleted. Retain (default) leaves the
                  project intact; Delete removes it upstream.
                enum:
                - Retain
                - Delete
                type: string
              registryName:
                description: |-
                  RegistryName is the user-provided registry name. Used as the Harbor project name
                  and to derive the credentials Secret name (registry-credentials-<cr-name>).
                  Unique within the (tenantID, projectID) pair.
                type: string
              tenantID:
                description: TenantID is the unique identifier for the tenant (e.g.
                  "acme").
                type: string
            required:
            - backendRef
            - projectID
            - tenantID
            type: object
          status:
            properties:
              conditions:
                description: Conditions holds standard Kubernetes status conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
