---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: registrybackends.registry.opencloud.wso2.com
spec:
  group: registry.opencloud.wso2.com
  names:
    kind: RegistryBackend
    listKind: RegistryBackendList
    plural: registrybackends
    singular: registrybackend
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenantID
      name: Tenant
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.registryURL
      name: URL
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RegistryBackend is the per-tenant shared Harbor deployment. One Backend per tenant;
          all of that tenant's RegistryInstances (datacenter projects) share it.
          dc-api creates this CR lazily on the first registry create for a tenant.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              plan:
                default: starter
                description: |-
                  Plan selects the Harbor resource profile. Upgrades only
                  (starter -> professional -> enterprise): a downgrade would imply
                  shrinking PVCs, which Kubernetes cannot do. Enforced at admission by the
                  CEL transition rule below (evaluated on UPDATE only).
                enum:
                - starter
                - professional
                - enterprise
                type: string
                x-kubernetes-validations:
                - message: plan can only be upgraded (starter -> professional -> enterprise),
                    never downgraded
                  rule: self == oldSelf || (oldSelf == 'starter' && self != 'starter')
                    || (oldSelf == 'professional' && self == 'enterprise')
              reclaimPolicy:
                default: Retain
                description: |-
                  ReclaimPolicy controls what happens to Harbor's data (PVCs) when this
                  Backend is deleted. Retain (default) leaves the PVCs on disk; Delete
                  removes them. Retain is the safe default for a registry.
                enum:
                - Retain
                - Delete
                type: string
              tenantID:
                description: |-
                  TenantID is the unique identifier for the tenant, deriving the Harbor
                  Helm release, namespace, and URL. Immutable — changing it would
                  repoint the Backend at a new Harbor target without reclaiming the old one.
                type: string
                x-kubernetes-validations:
                - message: tenantID is immutable
                  rule: self == oldSelf
            required:
            - tenantID
            type: object
          status:
            properties:
              adminSecretName:
                description: |-
                  AdminSecretName is the name (in this namespace) of the Secret holding
                  Harbor's admin + database passwords. Owned by this CR.
                type: string
              conditions:
                description: Conditions holds standard Kubernetes status conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              message:
                description: Message contains error details when Phase is Failed.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the .metadata.generation the controller last
                  reconciled. When it equals .metadata.generation the latest spec has
                  been processed.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is the lifecycle state of the Harbor deployment. Empty until the
                  first reconcile.
                enum:
                - Provisioning
                - Ready
                - Failed
                - Terminating
                type: string
              registryURL:
                description: RegistryURL is the Harbor portal URL, populated when
                  Phase is Ready.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
