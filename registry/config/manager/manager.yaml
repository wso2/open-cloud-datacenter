apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: registry
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: registry
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: registry
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: registry
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /registry-provisioner
        image: controller:latest
        # Using a mutable :latest tag — always pull so a redeploy picks up a
        # freshly pushed image instead of a cached one.
        imagePullPolicy: Always
        name: manager
        env:
        # REQUIRED: the base domain used to build registry URLs
        # (https://registry.<tenant>.<BASE_DOMAIN>). Replace with your own
        # domain; the value below (a documentation-reserved example address,
        # RFC 5737) resolves via nip.io for clusters without a real DNS
        # domain — nip.io maps <any-ip>.nip.io back to that IP, which is
        # useful for local/private clusters but not required in general.
        - name: BASE_DOMAIN
          value: "192.0.2.1.nip.io"
        # cert-manager ClusterIssuer for Harbor's per-tenant ingress TLS.
        # Let's Encrypt cannot validate a private/nip.io host, so a
        # CA-based internal issuer is used instead (one CA signs every
        # tenant cert). Must already exist on the cluster: `kubectl get
        # clusterissuer`. Use "letsencrypt-prod" instead if BASE_DOMAIN is a
        # real, publicly resolvable domain.
        - name: CERT_ISSUER
          value: "internal-ca"
        # Harbor serves that internal-CA cert, and the operator doesn't hold
        # the CA to verify it against, so the operator's own HTTPS calls to
        # the Harbor API skip TLS verification. Set to "false" once CERT_ISSUER
        # is a publicly trusted issuer.
        - name: HARBOR_INSECURE_TLS
          value: "true"
        # StorageClass for Harbor's PVCs. Must support allowVolumeExpansion
        # for plan upgrades to be able to grow storage. Replace with the
        # StorageClass name available on your cluster.
        - name: STORAGE_CLASS
          value: "longhorn"
        # Optional Harbor/Helm settings (defaults shown; override as needed).
        # - name: INGRESS_CLASS
        #   value: "nginx"
        # - name: HARBOR_CHART_VERSION
        #   value: "1.14.0"
        # Point Helm's cache/config/data at the writable /tmp volume below,
        # since the root filesystem is read-only.
        - name: HELM_CACHE_HOME
          value: /tmp/helm/cache
        - name: HELM_CONFIG_HOME
          value: /tmp/helm/config
        - name: HELM_DATA_HOME
          value: /tmp/helm/data
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      # Writable scratch for Helm (values, pulled charts, cache) because the
      # root filesystem is read-only.
      - name: tmp
        emptyDir: {}
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
