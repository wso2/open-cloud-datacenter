  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - registry.opencloud.wso2.com
  resources:
  - registrybackends/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - registry.opencloud.wso2.com
