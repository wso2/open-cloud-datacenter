apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/managed-by: kustomize
  name: registryinstance-admin-role
rules:
- apiGroups:
  - registry.opencloud.wso2.com
  resources:
  - registryinstances
  verbs:
  - '*'
- apiGroups:
  - registry.opencloud.wso2.com
  resources:
  - registryinstances/status
  verbs:
  - get
