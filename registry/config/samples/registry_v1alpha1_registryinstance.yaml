apiVersion: registry.opencloud.wso2.com/v1alpha1
kind: RegistryInstance
metadata:
  labels:
    app.kubernetes.io/name: registry
    app.kubernetes.io/managed-by: kustomize
  name: ri-sample-registry
  namespace: registry-system
spec:
  tenantID: sample-tenant
  projectID: sample-project
  registryName: sample-registry
  plan: starter
  # Retain (default) leaves the Harbor project on delete; Delete removes it.
  reclaimPolicy: Retain
  backendRef:
    name: rb-sample-tenant
    namespace: registry-system
